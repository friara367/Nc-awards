
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NC AWARDS — Голосование</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">◆ NC AWARDS</div>
    <p>ГОЛОСОВАНИЕ</p>
  </header>

  <main>
    <section class="intro">
      <h1>Выбирай лучших!</h1>
      <p>Один голос в каждой номинации.</p>
    </section>

    <section id="auth">
      <h2>Вход в NC AWARDS</h2>
      <p>Введи свою почту. Мы отправим тебе ссылку для входа.</p>
      <div class="login">
        <input id="email" type="email" placeholder="Твоя электронная почта">
        <button id="loginBtn">Получить ссылку</button>
      </div>
      <p id="authStatus" class="status"></p>
    </section>

    <section id="voting" hidden>
      <p id="userEmail" class="status"></p>
      <button id="logoutBtn">Выйти</button>
      <div id="categories" class="grid"></div>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
